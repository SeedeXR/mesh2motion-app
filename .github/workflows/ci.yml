name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A deeper nightly fuzz sweep. Every other job here is fast, so letting the
    # whole workflow run costs little and keeps the trigger in one place.
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  arch-gate:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: m2m-core must stay pure
        run: |
          # m2m-core is the crate we benchmark and unit-test with no window and
          # no Tauri runtime. See memory/architecture.md §2.
          #
          # The real breach vector is a Cargo.toml dependency, not a use
          # statement, so check the resolved dependency tree — that catches
          # transitive arrivals too.
          TREE=$(cargo tree -p m2m-core --edges normal --prefix none | sort -u)
          if echo "$TREE" | grep -qE '^(tauri|reqwest|tokio|hyper|ureq) '; then
            echo "::error::m2m-core gained a runtime/IO dependency:"
            echo "$TREE" | grep -E '^(tauri|reqwest|tokio|hyper|ureq) '
            exit 1
          fi
          # Belt and braces: direct filesystem/network use in the source.
          if grep -rnE '(^|[^a-zA-Z_:])std::(fs|net|process)::' crates/m2m-core/src/; then
            echo "::error::m2m-core must not touch the filesystem, network or subprocesses"
            exit 1
          fi
          echo "m2m-core boundary intact"
      - name: Library crates must forbid unsafe
        run: |
          for c in m2m-core m2m-io m2m-rig m2m-bridge; do
            grep -q '#!\[forbid(unsafe_code)\]' "crates/$c/src/lib.rs" \
              || { echo "::error::$c is missing #![forbid(unsafe_code)]"; exit 1; }
          done
          echo "unsafe forbidden in all library crates"

  fuzz:
    name: Fuzz (FBX read path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs nightly for the sanitizer.
      # Pinned rather than floating: `Swatinem/rust-cache` keys on the rustc
      # version, so `@nightly` rebuilds cargo-fuzz from source the first run of
      # every day, and a broken nightly reds the job for reasons of its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-29
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/m2m-io/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed the corpus
        # references/ is gitignored, so CI seeds from the committed rig and the
        # hand-written ASCII seeds only.
        run: crates/m2m-io/fuzz/seed.sh
      - name: Fuzz
        working-directory: crates/m2m-io/fuzz
        # 60s per target on a PR, half an hour on the nightly schedule
        # (memory/test.md §5). -rss_limit_mb turns runaway allocation into a
        # failure instead of a killed runner, and -timeout turns a hang into
        # one instead of a six-hour job. -max_len matters more than it looks:
        # without it libFuzzer adopts the largest seed as its cap, and the
        # 2.1 MB reference rig would make every generated input megabyte-scale
        # under ASan, spending the whole budget on a handful of slow runs.
        run: |
          seconds=${{ github.event_name == 'schedule' && '1800' || '60' }}
          # Run every target even if one crashes, then fail. Under the default
          # `bash -e` the first failure aborted the step, so a crash in
          # fbx_binary meant the other two never ran that night — the least
          # helpful moment to stop looking.
          failed=''
          for target in fbx_binary fbx_text fbx_pipeline glb; do
            echo "::group::$target"
            cargo fuzz run "$target" -- \
              -max_total_time="$seconds" -rss_limit_mb=2048 -timeout=10 \
              -max_len=65536 \
              || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "crashes in:$failed"
            exit 1
          fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/m2m-io/fuzz/artifacts/
          if-no-files-found: ignore

  rust:
    name: Rust ${{ matrix.job }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        job: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.job == 'test'
        run: cargo test --workspace --verbose
      - name: Clippy
        if: matrix.job == 'lint'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        if: matrix.job == 'lint'
        run: cargo fmt --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  legacy:
    name: Legacy reference suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: legacy
        run: npm ci
      - name: Test
        # legacy/ is the A/B baseline for the new solver (memory/test.md §9),
        # so it must keep working, not just keep existing.
        working-directory: legacy
        run: npx vitest run

  bundle:
    name: App bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        run: npx tauri build --bundles app
      - name: Check size budget
        run: |
          # Budget from memory/test.md §6. Compare in KB so the integer divide
          # cannot floor a 40.9 MB bundle down to a passing "40".
          KB=$(du -sk target/release/bundle/macos/Mesh2Motion.app | cut -f1)
          LIMIT_KB=$((40 * 1024))
          echo "bundle: ${KB} KB (budget ${LIMIT_KB} KB)"
          [ "$KB" -le "$LIMIT_KB" ] \
            || { echo "::error::bundle ${KB} KB exceeds ${LIMIT_KB} KB budget"; exit 1; }
