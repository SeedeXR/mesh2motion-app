sonar.projectKey=mesh2motion-app
sonar.projectName=Mesh2Motion
sonar.projectVersion=0.1.0

# Only the new native app is analysed. legacy/ is a frozen reference
# implementation kept for A/B comparison (memory/test.md §9), not code under
# active development — analysing it would flood the gate with findings nobody
# is going to act on.
sonar.sources=crates,src-tauri/src,app/src
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,legacy/**

sonar.tests=crates
sonar.test.inclusions=**/tests/**

sonar.sourceEncoding=UTF-8

# SonarQube 26.8 Community DOES ship a Rust analyser (sonar-rust-plugin), which
# analyses the crates on a plain `sonar-scanner` run — verified 2026-09-01, it
# raised 23 rust:S3776 (cognitive complexity) code smells, gate still OK. clippy
# -D warnings remains the CI gate; Sonar is advisory here and also covers the
# TypeScript frontend.
sonar.typescript.tsconfigPath=tsconfig.json
