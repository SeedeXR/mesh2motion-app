sonar.projectKey=mesh2motion-app
sonar.projectName=Mesh2Motion
sonar.projectVersion=0.1.0

# Only the new native app is analysed. legacy/ is a frozen reference
# implementation kept for A/B comparison (memory/test.md §9), not code under
# active development — analysing it would flood the gate with findings nobody
# is going to act on.
sonar.sources=crates,src-tauri/src,app/src
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,legacy/**

sonar.tests=crates
sonar.test.inclusions=**/tests/**

sonar.sourceEncoding=UTF-8

# Community Edition has no Rust analyser; Rust quality is gated by
# clippy -D warnings in CI instead. Sonar covers the TypeScript frontend.
sonar.typescript.tsconfigPath=tsconfig.json
