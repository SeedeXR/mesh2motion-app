# The rigging pipeline as a library: fit a template skeleton to a mesh, bind
# weights, retarget clips, export glb/fbx. Extracted from the Tauri app so both
# the app (src-tauri) and the MCP server (m2m-mcp) drive one implementation.
[package]
name = "m2m-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
m2m-core = { path = "../m2m-core" }
m2m-io = { path = "../m2m-io" }
m2m-rig = { path = "../m2m-rig" }
glam.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
